<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blocked · Teichos</title>
    <link rel="stylesheet" href="styles/blocked.css" />
  </head>
  <body>
    <main class="container">
      <img class="icon" src="/assets/icons/icon.svg" alt="" aria-hidden="true" />
      <h1>Page blocked</h1>
      <p class="message">This page has been blocked by Teichos based on your filter settings.</p>
      <p class="preview-note" id="preview-note" hidden>Preview with sample data.</p>
      <button
        class="text-link"
        id="learn-more"
        type="button"
        aria-expanded="false"
        aria-controls="block-extras"
      >
        Learn more
      </button>
      <div id="block-extras" role="group" aria-label="Block details" tabindex="-1" hidden>
        <div class="block-card">
          <div class="url" id="blocked-url" role="status" aria-label="Blocked URL"></div>
          <section class="details" id="responsible-filter" aria-label="Responsible filter" hidden>
            <dl>
              <div>
                <dt>Filter</dt>
                <dd id="responsible-filter-name"></dd>
              </div>
              <div>
                <dt>Pattern</dt>
                <dd id="responsible-filter-pattern"></dd>
              </div>
              <div>
                <dt>Match</dt>
                <dd id="responsible-filter-match"></dd>
              </div>
              <div>
                <dt>Group</dt>
                <dd id="responsible-filter-group"></dd>
              </div>
              <div>
                <dt>Schedule</dt>
                <dd id="responsible-filter-schedule"></dd>
              </div>
            </dl>
          </section>
        </div>
        <div class="actions">
          <button class="button large" id="go-back" type="button">Go back</button>
          <button class="button large secondary" id="continue" type="button" hidden>
            Continue anyway
          </button>
          <button class="button large secondary" id="open-options" type="button">
            Manage filters
          </button>
        </div>
      </div>
    </main>
    <script src="./index.ts" type="module"></script>
  </body>
</html>
