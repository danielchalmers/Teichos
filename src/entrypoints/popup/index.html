<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teichos</title>
    <link rel="stylesheet" href="styles/popup.css" />
  </head>
  <body>
    <header class="header">
      <h1 class="app-title">
        <img class="app-icon" src="/assets/icons/icon.svg" alt="" />
        Teichos
      </h1>
      <div class="header-actions">
        <div class="snooze-popover" id="snooze-popover">
          <button
            class="snooze-button snooze-trigger"
            id="open-snooze"
            type="button"
            aria-label="Active, snooze filtering"
            aria-expanded="false"
            aria-controls="snooze-dialog-panel"
            title="Filtering is active."
          >
            <span class="status-dot" aria-hidden="true"></span>
            <span class="snooze-trigger-text" id="snooze-label">Active</span>
            <svg class="snooze-chevron" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path
                d="M4 6l4 4 4-4"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
        <button
          class="icon-button"
          id="open-options"
          type="button"
          aria-label="Settings"
          title="Settings"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              d="M19.4 12.94a7.63 7.63 0 0 0 .04-.94 7.63 7.63 0 0 0-.04-.94l2.02-1.57a.5.5 0 0 0 .12-.64l-1.91-3.3a.5.5 0 0 0-.6-.22l-2.38.96a7.52 7.52 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.82a.5.5 0 0 0-.5.42l-.36 2.54c-.57.22-1.12.53-1.63.94l-2.38-.96a.5.5 0 0 0-.6.22l-1.91 3.3a.5.5 0 0 0 .12.64l2.02 1.57c-.03.31-.04.62-.04.94s.01.63.04.94l-2.02 1.57a.5.5 0 0 0-.12.64l1.91 3.3a.5.5 0 0 0 .6.22l2.38-.96c.51.41 1.06.72 1.63.94l.36 2.54a.5.5 0 0 0 .5.42h3.82a.5.5 0 0 0 .5-.42l.36-2.54c.57-.22 1.12-.53 1.63-.94l2.38.96a.5.5 0 0 0 .6-.22l1.91-3.3a.5.5 0 0 0-.12-.64l-2.02-1.57ZM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"
              fill="none"
              stroke="currentColor"
              stroke-width="2.25"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>
    </header>
    <main class="content">
      <!-- Not a live region: it shows an absolute end time, and the status region already
           announces snoozing and resuming. -->
      <div class="notice snooze-banner" id="snooze-banner" hidden>
        <span class="status-dot" aria-hidden="true"></span>
        <div class="notice-text">
          <p class="notice-title">Filtering is snoozed</p>
          <p class="notice-detail" id="snooze-banner-detail"></p>
          <p class="dialog-error" id="snooze-banner-error" hidden></p>
        </div>
        <button class="button small secondary" id="snooze-banner-resume" type="button">
          Resume
        </button>
      </div>
      <div class="filter-list" id="filter-list" role="list" aria-label="Active filters"></div>
    </main>
    <footer class="footer-bar">
      <button
        class="button block"
        id="open-quick-add"
        type="button"
        aria-expanded="false"
        aria-controls="quick-add-panel"
      >
        <span class="button-icon" aria-hidden="true">
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path
              d="M8 3.5v9M3.5 8h9"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
        </span>
        New temporary block
      </button>
    </footer>
    <div class="snooze-dialog" id="snooze-dialog" aria-hidden="true" inert>
      <div
        class="snooze-dialog-backdrop"
        data-action="close-snooze-dialog"
        aria-hidden="true"
      ></div>
      <div
        class="dialog-panel dialog"
        id="snooze-dialog-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="snooze-dialog-title"
        aria-describedby="snooze-dialog-subtitle"
      >
        <div class="dialog-header">
          <div class="dialog-heading">
            <div class="dialog-title" id="snooze-dialog-title">Snooze filtering</div>
            <div class="dialog-subtitle" id="snooze-dialog-subtitle">
              Pause all filtering for a set time.
            </div>
          </div>
          <button
            class="icon-button"
            type="button"
            data-action="close-snooze-dialog"
            aria-label="Close snooze dialog"
            title="Close snooze dialog"
          >
            <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path
                d="M4 4l8 8M12 4l-8 8"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>
        <button class="button block" type="button" data-action="resume-snooze" hidden>
          Resume filtering
        </button>
        <div class="dialog-section" role="group" aria-labelledby="snooze-quick-label">
          <div class="field-label" id="snooze-quick-label">Snooze for</div>
          <div class="chip-grid">
            <button class="chip snooze-option" type="button" data-snooze-minutes="15">15m</button>
            <button class="chip snooze-option" type="button" data-snooze-minutes="30">30m</button>
            <button class="chip snooze-option" type="button" data-snooze-minutes="60">1h</button>
            <button class="chip snooze-option" type="button" data-snooze-minutes="120">2h</button>
            <button class="chip snooze-option" type="button" data-snooze-minutes="240">4h</button>
            <button class="chip snooze-option" type="button" data-snooze-minutes="480">8h</button>
            <button class="chip snooze-option" type="button" data-snooze-minutes="1440">1d</button>
            <button class="chip snooze-option" type="button" data-snooze-minutes="4320">3d</button>
          </div>
        </div>
        <div class="dialog-section" role="group" aria-labelledby="snooze-custom-label">
          <div class="field-label" id="snooze-custom-label">Custom duration</div>
          <!-- A form, so Enter in the field snoozes, as it does in the temporary block dialog. -->
          <form class="snooze-custom" id="snooze-custom-form" novalidate>
            <input
              class="input"
              type="number"
              id="snooze-custom-duration"
              min="1"
              step="1"
              inputmode="numeric"
              value="30"
              aria-label="Custom snooze duration"
            />
            <select class="input" id="snooze-custom-unit" aria-label="Custom snooze unit">
              <option value="minutes">Minutes</option>
              <option value="hours">Hours</option>
              <option value="days">Days</option>
            </select>
            <button class="button secondary" type="submit">Snooze</button>
          </form>
        </div>
        <p class="dialog-error" id="snooze-error" hidden></p>
      </div>
    </div>
    <div class="quick-add" id="quick-add" aria-hidden="true" inert>
      <div class="quick-add-backdrop" data-action="close-quick-add" aria-hidden="true"></div>
      <div
        class="dialog-panel dialog"
        id="quick-add-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="quick-add-title"
        aria-describedby="quick-add-subtitle"
      >
        <div class="dialog-header">
          <div class="dialog-heading">
            <div class="dialog-title" id="quick-add-title">New temporary block</div>
            <div class="dialog-subtitle" id="quick-add-subtitle">
              Create a short-lived block that expires automatically.
            </div>
          </div>
          <button
            class="icon-button"
            type="button"
            data-action="close-quick-add"
            aria-label="Close temporary block dialog"
            title="Close temporary block dialog"
          >
            <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path
                d="M4 4l8 8M12 4l-8 8"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>
        <form id="quick-add-form" class="quick-add-form" novalidate>
          <div class="dialog-section">
            <label class="field-label" for="quick-add-pattern">Site or pattern</label>
            <input
              class="input"
              type="text"
              id="quick-add-pattern"
              name="pattern"
              placeholder="e.g., youtube.com"
              required
            />
          </div>
          <div class="dialog-section">
            <label class="field-label" for="quick-add-duration">Block for</label>
            <div class="quick-add-duration">
              <input
                class="input"
                type="number"
                id="quick-add-duration"
                name="duration"
                min="1"
                inputmode="numeric"
                required
              />
              <select class="input" id="quick-add-unit" name="unit" aria-label="Duration unit">
                <option value="minutes">Minutes</option>
                <option value="hours">Hours</option>
                <option value="days">Days</option>
              </select>
            </div>
            <div class="chip-grid" role="group" aria-label="Duration presets">
              <button class="chip" type="button" data-duration="15" data-unit="minutes">15m</button>
              <button class="chip" type="button" data-duration="30" data-unit="minutes">30m</button>
              <button class="chip" type="button" data-duration="1" data-unit="hours">1h</button>
              <button class="chip" type="button" data-duration="2" data-unit="hours">2h</button>
            </div>
          </div>
          <p class="dialog-error" id="quick-add-error" hidden></p>
          <div class="dialog-actions fill">
            <button class="button secondary" type="button" data-action="close-quick-add">
              Cancel
            </button>
            <button class="button" type="submit">Start block</button>
          </div>
          <p class="quick-add-more">
            Need a schedule or exception?
            <button class="text-link" type="button" data-action="open-settings">
              Open settings
            </button>
          </p>
        </form>
      </div>
    </div>
    <div id="status-message" class="sr-only" role="status"></div>
    <template id="popup-empty-state-template">
      <div class="empty-state" role="listitem">
        <svg class="empty-state-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <path
            d="M16 2.75c.3 0 .6.05.875.15 2.475.85 5.4 1.85 8.75 3.025a2.4 2.4 0 0 1 1.6 2.25v5.15c0 7.125-3.875 12.375-10.625 15.6a1.4 1.4 0 0 1-1.2 0c-6.75-3.225-10.625-8.475-10.625-15.6V8.175a2.4 2.4 0 0 1 1.6-2.25c3.35-1.175 6.275-2.175 8.75-3.025.275-.1.575-.15.875-.15Z"
            fill="none"
            stroke="currentColor"
            stroke-width="1"
            stroke-linejoin="round"
          />
        </svg>
        <p class="empty-state-title">No filters yet</p>
        <p class="empty-state-text">
          Block a site for a while with a temporary block, or set up filters and schedules in
          settings.
        </p>
        <button class="button secondary" type="button" data-action="add-first-filter">
          <span class="button-icon" aria-hidden="true">
            <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path
                d="M8 3.5v9M3.5 8h9"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              />
            </svg>
          </span>
          New filter
        </button>
      </div>
    </template>
    <!-- Filters exist, but none of them shows: the text says why (see describeHiddenFilters). -->
    <template id="popup-inactive-state-template">
      <div class="empty-state" role="listitem">
        <svg class="empty-state-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <path
            d="M16 2.75c.3 0 .6.05.875.15 2.475.85 5.4 1.85 8.75 3.025a2.4 2.4 0 0 1 1.6 2.25v5.15c0 7.125-3.875 12.375-10.625 15.6a1.4 1.4 0 0 1-1.2 0c-6.75-3.225-10.625-8.475-10.625-15.6V8.175a2.4 2.4 0 0 1 1.6-2.25c3.35-1.175 6.275-2.175 8.75-3.025.275-.1.575-.15.875-.15Z"
            fill="none"
            stroke="currentColor"
            stroke-width="1"
            stroke-linejoin="round"
          />
        </svg>
        <p class="empty-state-title">No filters apply here right now</p>
        <p class="empty-state-text empty-state-reasons"></p>
        <button class="button secondary" type="button" data-action="open-settings">
          Open settings
        </button>
      </div>
    </template>
    <template id="popup-filter-item-template">
      <div class="filter-item" role="listitem">
        <div class="filter-info">
          <div class="filter-name"></div>
          <div class="filter-group"></div>
        </div>
        <div class="filter-actions">
          <div class="quick-actions">
            <button
              class="icon-button"
              type="button"
              data-action="copy-url"
              aria-label="Copy pattern"
              title="Copy pattern"
            >
              <svg class="icon-copy" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                <g
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="5.5" y="5.5" width="8" height="8" rx="1.5" />
                  <path d="M10.5 5.5v-2a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2" />
                </g>
              </svg>
              <svg class="icon-tick" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                <path
                  d="M3.5 8.5l3 3 6-6"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <button
              class="icon-button"
              type="button"
              data-action="edit-filter"
              aria-label="Edit filter"
              title="Edit filter"
            >
              <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                <path
                  d="M10.5 2.5l3 3-8 8H2.5v-3zM9 4l3 3"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <button
              class="icon-button"
              type="button"
              data-action="delete-filter"
              aria-label="Delete filter"
              title="Delete filter"
              hidden
            >
              <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                <path
                  d="M3 4.5h10M6 4.5V3h4v1.5M4.5 4.5l.7 8.5h5.6l.7-8.5M6.75 7v3.5M9.25 7v3.5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
          <label class="toggle">
            <input type="checkbox" />
            <span class="slider" aria-hidden="true"></span>
          </label>
        </div>
      </div>
    </template>
    <template id="popup-inactive-summary-template">
      <div class="inactive-summary" role="listitem"></div>
    </template>
    <script src="./index.ts" type="module"></script>
  </body>
</html>
